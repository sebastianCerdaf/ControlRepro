<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Contacto de Proveedores</title>
  <link rel="stylesheet" href="../../style.css">
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-container-circle" style="width: 110px; height: 110px; margin-bottom: 1rem;">
          <img src="../../assets/Icon.png" alt="Logo ControlRepro" class="logo-principal" />
        </div>
      </div>
      <nav class="sidebar-nav">
        <a href="MainView.html">📦 Inventario</a>
        <a href="ContactsView.html" class="active">📇 Contactos</a>
      </nav>
      <div class="sidebar-footer">
        <button class="btn btn-light" style="width: 100%;" onclick="window.location.href='MainView.html'">⬅ Volver</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="content-header">
        <h1>Contacto de Proveedores</h1>
      </div>

      <div class="card">
        <form @submit.prevent="agregarProveedor" novalidate>
          <div class="form-grid" style="grid-template-columns: 2fr 1fr 1fr;">
            <div class="form-group">
              <label>Proveedor</label>
              <input v-model.trim="nuevo.nombre" placeholder="Nombre del proveedor" required />
            </div>
            <div class="form-group">
              <label>Teléfono</label>
              <input v-model.trim="nuevo.telefono" placeholder="+56 9 xxxx xxxx" />
            </div>
            <div class="form-group">
              <label>Email</label>
              <input v-model.trim="nuevo.email" type="email" placeholder="correo@proveedor.cl" />
            </div>
          </div>
          <div class="form-group">
            <label>Dirección</label>
            <input v-model.trim="nuevo.direccion" placeholder="Calle, número, comuna" />
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">➕ Agregar Proveedor</button>
            <button type="button" class="btn btn-secondary" @click="limpiarForm" :disabled="!tieneDatos">🧹 Limpiar</button>
          </div>
        </form>
      </div>

      <div class="card table-wrapper">
        <table class="table">
          <thead>
            <tr>
              <th>Proveedor</th>
              <th>Teléfono</th>
              <th>Email</th>
              <th>Dirección</th>
              <th style="width:110px;"></th>
            </tr>
          </thead>
          <tbody>
            <tr v-if="!proveedores.length">
              <td colspan="5" style="text-align:center;">No hay proveedores registrados.</td>
            </tr>
            <tr v-for="(prov, i) in proveedores" :key="i">
              <td><strong>{{ prov.nombre }}</strong></td>
              <td>{{ prov.telefono }}</td>
              <td>{{ prov.email }}</td>
              <td>{{ prov.direccion }}</td>
              <td>
                <button class="btn btn-danger" @click="eliminarProveedor(i)">Eliminar</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <div id="popupError" class="popup-error"></div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script>
    const STORAGE_KEY = 'agendaProveedores';

    const app = {
      data() {
        return {
          proveedores: [],
          nuevo: { nombre: '', telefono: '', email: '', direccion: '' }
        };
      },

      computed: {
        tieneDatos() {
          const p = this.nuevo;
          return p.nombre || p.telefono || p.email || p.direccion;
        }
      },

      mounted() {
        const guardados = localStorage.getItem(STORAGE_KEY);
        if (guardados) {
          this.proveedores = JSON.parse(guardados);
        } else {
          this.proveedores = [
            { nombre: 'Distribuidora Norte',  telefono: '+56 9 1234 5678', email: 'norte@proveedor.cl',    direccion: 'Av. Norte 123, Santiago' },
            { nombre: 'Proveeduría Centro',   telefono: '+56 2 9876 5432', email: 'centro@proveedor.cl',   direccion: 'Calle Centro 456, Santiago' },
            { nombre: 'Suministros Sur',      telefono: '+56 9 1122 3344', email: 'sur@suministros.cl',    direccion: 'Pasaje Sur 789, Rancagua' }
          ];
          this.guardar();
        }
      },

      methods: {
        agregarProveedor() {
          if (!this.nuevo.nombre) return this.err('El nombre del proveedor es obligatorio.');
          if (this.proveedores.some(p => p.nombre.toLowerCase() === this.nuevo.nombre.toLowerCase())) {
            return this.err('Ya existe un proveedor con ese nombre.');
          }
          if (this.nuevo.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(this.nuevo.email)) {
            return this.err('El email no tiene un formato válido.');
          }

          this.proveedores.push({ ...this.nuevo });
          this.guardar();
          this.limpiarForm();
        },

        eliminarProveedor(idx) {
          if (!confirm('¿Eliminar este proveedor?')) return;
          this.proveedores.splice(idx, 1);
          this.guardar();
        },

        limpiarForm() {
          this.nuevo = { nombre: '', telefono: '', email: '', direccion: '' };
        },

        guardar() {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(this.proveedores));
        },

        err(msg) {
          const popup = document.getElementById('popupError');
          popup.textContent = msg;
          popup.classList.add('visible');
          setTimeout(() => popup.classList.remove('visible'), 2500);
        }
      }
    };

    Vue.createApp(app).mount('#app');
  </script>
</body>
</html>
